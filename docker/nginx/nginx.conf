# Балансировщик перед репликами прокси с привязкой по ресурсу.
#
# Ключ шардирования — первые два сегмента пути (/books/42 для /books/42 и
# /books/42/authors). Поэтому карточка и связанные с ней запросы попадают на
# одну реплику: кэш работает как один, а предиктор видит переход
# «карточка -> авторы» там же, где потом делает предзагрузку. С ключом по
# полному $request_uri карточка и авторы разъехались бы по разным репликам,
# и предзагрузка перестала бы срабатывать.
events {}

http {
    map $uri $shard_key {
        ~^(?<prefix>/[^/]+/[^/]+) $prefix;
        default                   $uri;
    }

    upstream proks {
        hash $shard_key consistent;
        server proxy:8080 max_fails=3 fail_timeout=5s;
        server proxy-2:8080 max_fails=3 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 8090;

        location / {
            proxy_pass http://proks;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # При падении реплики запрос уходит на следующую по кольцу.
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
