services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: library_password
      POSTGRES_DB: library_db
    volumes:
      - ./migrations/001_library_schema.sql:/docker-entrypoint-initdb.d/001_library_schema.sql:ro
      - ./csv_files:/tmp/csv_files:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_user -d library_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  upstream:
    build:
      context: .
      dockerfile: Dockerfile.upstream
    ports:
      - "8081:8081"
    environment:
      DB_DSN: "postgres://library_user:library_password@postgres:5432/library_db?sslmode=disable"
      LISTEN_ADDR: ":8081"
      # PUT /books/{id} asks the proxy to purge what it changed; the proxy
      # fans the purge out to every replica through RabbitMQ.
      INVALIDATION_URL: "http://proxy:8080/admin/purge"
      INVALIDATION_TOKEN: "${ADMIN_TOKEN:-dev-admin-token}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck", "http://localhost:8081/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Every replica needs its own PROXY_REPLICA_ID (its own RabbitMQ queue, so it
  # receives every invalidation) and its own events volume (state.json and
  # events.log are per replica). Do not use `--scale proxy=N`: scaled copies
  # share both and split the invalidations between them.
  proxy: &proxy
    build: .
    restart: on-failure
    ports:
      - "8080:8080"
    environment: &proxy-env
      UPSTREAM_URL: "http://upstream:8081"
      LISTEN_ADDR: ":8080"
      PROXY_REPLICA_ID: "proxy-1"
      EVENT_VERSION_STATE_PATH: "/var/lib/proks/events/state.json"
      EVENT_LOG_PATH: "/var/lib/proks/events/events.log"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      RABBITMQ_REQUIRED: "true"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-dev-admin-token}"
      ROUTES_CONFIG: "/etc/proks/routes.yaml"
      PREFETCH_ENABLED: "true"
      LOG_LEVEL: "info"
    volumes:
      - proxy-events:/var/lib/proks/events
      - ./routes.example.yaml:/etc/proks/routes.yaml:ro
    depends_on:
      upstream:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "/healthcheck", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  proxy-2:
    <<: *proxy
    ports:
      - "8082:8080"
    environment:
      <<: *proxy-env
      PROXY_REPLICA_ID: "proxy-2"
    volumes:
      - proxy-2-events:/var/lib/proks/events
      - ./routes.example.yaml:/etc/proks/routes.yaml:ro

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus:/etc/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

  # Load tests run on demand, not on every `docker compose up`:
  #   docker compose --profile load run --rm k6 run /scripts/burst.js
  k6:
    image: grafana/k6:latest
    profiles: ["load"]
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      BASE_URL: "http://proxy:8080"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-dev-admin-token}"
    volumes:
      - ./k6:/scripts:ro
    entrypoint: ["k6"]
    command: ["run", "/scripts/read-heavy.js"]

volumes:
  pgdata:
  proxy-events:
  proxy-2-events:
