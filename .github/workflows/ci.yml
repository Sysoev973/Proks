name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: library_user
          POSTGRES_PASSWORD: library_password
          POSTGRES_DB: library_db
        options: >-
          --health-cmd "pg_isready -U library_user -d library_db"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      # No RabbitMQ or PostgreSQL: the integration tests skip themselves, so
      # this is what a contributor gets from a plain `go test ./...`.
      - name: Unit tests
        run: go test -race -covermode=atomic -coverprofile=coverage-unit.out ./...

      - name: Unit coverage gate
        run: sh scripts/check-coverage.sh coverage-unit.out .github/coverage-unit.txt

      - name: Load the demo database
        env:
          PGPASSWORD: library_password
        run: |
          # The schema COPYs the CSVs from /tmp/csv_files on the server.
          docker cp csv_files "${{ job.services.postgres.id }}:/tmp/csv_files"
          psql -h localhost -U library_user -d library_db -v ON_ERROR_STOP=1 -q -f migrations/001_library_schema.sql > /dev/null

      - name: Integration tests
        env:
          RABBITMQ_TEST_URL: amqp://guest:guest@localhost:5672/
          TEST_DATABASE_URL: postgres://library_user:library_password@localhost:5432/library_db?sslmode=disable
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage-integration.out ./internal/events ./cmd/upstream

      - name: Integration coverage gate
        run: sh scripts/check-coverage.sh coverage-integration.out .github/coverage-integration.txt

      - name: Coverage report
        if: always()
        run: |
          for profile in coverage-unit.out coverage-integration.out; do
            [ -f "$profile" ] && go tool cover -html="$profile" -o "${profile%.out}.html"
          done
          true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage-*.out
            coverage-*.html
